<!doctype html><html><head><meta charset="utf-8"><style>@import url("https://fonts.googleapis.com/css2?family=Anton&display=swap");
html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:#0b0b0b;font-family:Inter}
.m{position:absolute;inset:0;background-size:cover;background-position:center;background-color:#1a1a1a}.o{position:absolute;inset:0;width:1080px;height:1350px}
.k{position:absolute;left:60px;bottom:330px;background:var(--c);padding:12px 32px;font:800 50px Inter;color:#fff;text-transform:uppercase;border-radius:0 20px 20px 0}
h1{position:absolute;left:60px;right:60px;bottom:90px;margin:0;font:800 65px/1.2 Inter;color:#fff}.hl{color:var(--c)}
.g{position:absolute;left:0;right:0;bottom:0;height:20px;background:var(--c)}</style></head>
<body style="--c:{{cor_destaque}}"><div class="m" style="background-image:url('{{imagem_fundo}}')"></div><img class="o" src="{{imagem_recorte}}"><div class="k">{{kicker}}</div><h1>{{titulo_html}}</h1><div class="g"></div></body></html>
