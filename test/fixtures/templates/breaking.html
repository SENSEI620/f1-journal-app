<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:#0b0b0b}
.m{position:absolute;inset:0;background-size:cover;background-color:#1a1a1a}
.b{position:absolute;left:0;right:0;bottom:200px;text-align:center;font:230px Anton;color:#fff;-webkit-text-stroke:3px var(--c)}
.d{position:absolute;left:50px;right:50px;bottom:80px;text-align:center;font:800 40px Inter;color:#fff}.g{position:absolute;left:0;right:0;bottom:0;height:20px;background:var(--c)}</style></head>
<body style="--c:{{cor_destaque}}"><div class="m" style="background-image:url('{{imagem_fundo}}')"></div><div class="b">{{nome_bomba}}</div><div class="d">{{descricao_html}}</div><div class="g"></div></body></html>
